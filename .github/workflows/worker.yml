# Deploys the blog's picture service (worker/) to Cloudflare when it changes on main.
# Needs the CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" + "Workers R2 Storage: Edit") and CLOUDFLARE_ACCOUNT_ID
# repository secrets; without them it does nothing. With DISPATCH_TOKEN (a fine-grained GitHub token for this repository
# with "Actions: Read and write") it also hands the service the token it starts the blog's page build with.
# ANALYTICS_SECRET (optional, any long random string) is the secret the visitor statistics hash with (worker/src/analytics.js).
name: Deploy picture service
on:
  push:
    branches: [main]
    paths: [worker/**]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
      ANALYTICS_SECRET: ${{ secrets.ANALYTICS_SECRET }}
    steps:
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN is not set; skipping."
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4"
          secrets: |
            ${{ env.DISPATCH_TOKEN != '' && 'DISPATCH_TOKEN' || '' }}
            ${{ env.ANALYTICS_SECRET != '' && 'ANALYTICS_SECRET' || '' }}
